# GitHub secret scanning: paths excluded from alerts.
#
# The three files below are the credential scrubber's test corpus and contain
# credential-shaped strings on purpose. Every value in them is synthetic; the
# comment at the top of each file says so, and .gitleaks.toml carries the same
# list for gitleaks. Nothing else is excluded, so a real secret anywhere else
# in the tree is still reported.
paths-ignore:
  - "internal/scrub/scrub_test.go"
  - "internal/receiver/receiver_test.go"
  - "server/ingest/scrub_test.go"
