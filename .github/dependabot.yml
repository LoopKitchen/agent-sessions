# Weekly dependency updates. The client is stdlib-only, so gomod updates only
# touch the server's two direct dependencies (pgx, goldmark) and their
# transitive set; github-actions covers the pinned action versions in
# .github/workflows.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
