<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — loop sessions</title>
<link rel="icon" href="data:,">
<style>
 body{font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      display:grid;place-items:center;min-height:100vh;margin:0;
      background:#fafafa;color:#1a1a1a}
 @media (prefers-color-scheme:dark){body{background:#141414;color:#eaeaea}}
 .card{max-width:26rem;padding:2.5rem;text-align:center}
 .brand{font-size:1.375rem;margin:0 0 .25rem;font-weight:600;letter-spacing:-.01em}
 .brand span{opacity:.4}
 .lead{margin:0 0 1.75rem;opacity:.75}
 button{font:inherit;font-weight:500;padding:.7rem 1.4rem;border-radius:.5rem;
        border:1px solid rgba(128,128,128,.35);background:#fff;color:inherit;cursor:pointer}
 @media (prefers-color-scheme:dark){button{background:#1f1f1f}}
 button[disabled]{opacity:.5;cursor:default}
 .status{margin:1.25rem 0 0;min-height:1.6em;font-size:.9375rem;opacity:.75}
</style>
</head>
<body data-api-key="{{.APIKey}}" data-auth-domain="{{.AuthDomain}}" data-project-id="{{.ProjectID}}">
<main class="card">
  <h1 class="brand">loop<span>/</span>sessions</h1>
  <p class="lead">Sign in with your work Google account.</p>

  <form id="signin" method="post" action="{{.SessionPath}}">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <input type="hidden" name="next" value="{{.Next}}">
    <input type="hidden" name="id_token" value="">
    <!-- Disabled until the script has an SDK to hand it to. A button that is
         live before then is a button whose first click does nothing, which
         reads as a broken service rather than as a slow one. -->
    <button id="signin-button" type="submit" disabled>Sign in with Google</button>
  </form>

  <!-- The script clears this. It says something rather than nothing so that a
       browser which never ran the script — extension, blocked CDN, corporate
       proxy — explains the disabled button instead of leaving it inexplicable.
       noscript alone would not: a module that fails to load is not noscript. -->
  <p id="signin-status" class="status" role="status">Loading Google sign-in…</p>
  <noscript><p class="status">Signing in needs JavaScript. This is the only page in loop-sessions that does.</p></noscript>
</main>
<script type="module" src="{{.ScriptPath}}"></script>
</body>
</html>
