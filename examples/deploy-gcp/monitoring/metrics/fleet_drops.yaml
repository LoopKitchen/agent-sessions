# One per "fleet drops" line: a machine's dropped-event counter rose for one
# reason since the evaluator last looked. The delta is in the line (field
# delta), the metric counts machines-with-drops per tick, which is the
# alertable fact; the reason label decides the runbook path (disk_full is the
# disk floor, queue_overflow the outbox cap, hook_abandoned a hook that timed
# out, rejected:<reason> the server refusing an item).
name: loop_sessions/fleet_drops
description: Machines whose dropped-event counter rose since the last evaluator tick, by reason and person (server line "fleet drops")
filter: >-
  resource.type="cloud_run_revision"
  AND resource.labels.service_name="loop-sessions"
  AND log_id("run.googleapis.com/stdout")
  AND jsonPayload.message="fleet drops"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  labels:
    - key: reason
      valueType: STRING
      description: The drop reason the client recorded
    - key: email
      valueType: STRING
      description: Whose machine; the fleet is small enough for this to be a label
labelExtractors:
  reason: EXTRACT(jsonPayload.reason)
  email: EXTRACT(jsonPayload.email)
