# One per "skill invocation store failed" line: the store could not write a
# skill row, at ingest (op=derive, the savepoint rolled the skill work back
# and the events still committed) or behind a 5xx on the skill route. The
# sessions are queued for the dirty tick either way; the count is what
# alerts, the line carries the error.
name: loop_sessions/skill_store_error
description: Skill invocation writes the store failed (server line "skill invocation store failed")
filter: >-
  resource.type="cloud_run_revision"
  AND resource.labels.service_name="loop-sessions"
  AND log_id("run.googleapis.com/stdout")
  AND jsonPayload.message="skill invocation store failed"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  labels:
    - key: platform
      valueType: STRING
labelExtractors:
  platform: EXTRACT(jsonPayload.platform)
