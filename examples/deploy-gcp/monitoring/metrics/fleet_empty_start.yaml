# One per "fleet empty_start" line: a machine over the empty-start rule (at
# least twenty lifecycle-only spawns in a day and at least half of its
# sessions). The line carries the cwd set and the launcher-probe recipe; the
# metric only counts the people over the rule per tick, which is what the
# alert needs.
name: loop_sessions/fleet_empty_start
description: Machines over the empty-start rule per evaluator tick, by person (server line "fleet empty_start")
filter: >-
  resource.type="cloud_run_revision"
  AND resource.labels.service_name="loop-sessions"
  AND log_id("run.googleapis.com/stdout")
  AND jsonPayload.message="fleet empty_start"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  labels:
    - key: email
      valueType: STRING
      description: Whose machine
labelExtractors:
  email: EXTRACT(jsonPayload.email)
