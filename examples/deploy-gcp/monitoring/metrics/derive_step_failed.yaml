# One per "derive step failed" line: a derive step reached its retry cap and
# the runner stopped advancing it. The line carries the recovery statement
# (field recover); the runbook says when to run it.
name: loop_sessions/derive_step_failed
description: Derive steps that reached their retry cap, by step (server line "derive step failed")
filter: >-
  resource.type="cloud_run_revision"
  AND resource.labels.service_name="loop-sessions"
  AND log_id("run.googleapis.com/stdout")
  AND jsonPayload.message="derive step failed"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  labels:
    - key: step
      valueType: STRING
      description: The derive step that failed
labelExtractors:
  step: EXTRACT(jsonPayload.step)
